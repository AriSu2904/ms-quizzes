version: '3.8'

services:
  ms-quizzes:
    build: .
    container_name: quizzes-cnt
    ports:
      - "3000:3000"
    environment:
      - MS_LEARNING=http://learning-cnt:8080
      - REDIS_HOST=redis-container
      - REDIS_PORT=6379
    depends_on:
      - learning-cnt
      - redis-container
      - postgres-container
    networks:
      - my-network

  learning-cnt:
    image: cerrealkilla001/ms-learning:v1
    container_name: learning-cnt
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-container:5432/p3tki
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres-container
    networks:
      - my-network

  postgres-container:
    image: postgres:latest
    container_name: postgres-container
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=postgres
      - POSTGRES_DB=p3tki
    ports:
      - "5432:5432"
    networks:
      - my-network

  redis-container:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
